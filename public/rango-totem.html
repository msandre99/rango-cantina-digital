<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RANGO — Totem</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/rangofav.png" type="image/png">
  <style>

    :root {
      --bg:       #070707;
      --bg2:      #101114;
      --surface:  #141519;
      --surface2: #1b1d22;
      --orange:   #ff3600;
      --orange2:  #ff5500;
      --yellow:   #ffd54a;
      --white:    #f5f7fa;
      --muted:    #8c919b;
      --green:    #58d68d;
      --red:      #ff4d4d;
      --glass:    rgba(255,255,255,0.05);
      --border:   rgba(255,255,255,0.08);
      --shadow:   0 10px 40px rgba(0,0,0,0.45);
      --gradient: linear-gradient(135deg,#ff3600,#ff5500);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background:
        radial-gradient(circle at top right,   rgba(255,122,0,0.12), transparent 30%),
        radial-gradient(circle at bottom left,  rgba(255,85,0,0.08),  transparent 30%),
        var(--bg);
      color: var(--white);
      height: 100vh;
      overflow: hidden;
    }

   
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='0.03' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #090909; }
    ::-webkit-scrollbar-thumb { background: var(--gradient); border-radius: 20px; }

    .app { display:flex; flex-direction:column; height:100vh; position:relative; z-index:1; }

    .welcome-screen {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      position:relative; overflow:hidden;
    }


    .welcome-screen::before {
      content:''; position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events:none;
    }


    .welcome-screen::after {
      content:''; position:absolute;
      width:700px; height:700px; border-radius:50%;
      background: radial-gradient(circle, rgba(255,122,0,0.14) 0%, transparent 70%);
      top:50%; left:50%; transform:translate(-50%,-50%);
      filter:blur(60px); pointer-events:none;
      animation: orbPulse 8s ease-in-out infinite;
    }
    @keyframes orbPulse {
      0%,100% { transform:translate(-50%,-50%) scale(1); }
      50%      { transform:translate(-50%,-50%) scale(1.08); }
    }

    .welcome-eyebrow {
      font-family:'Syne',sans-serif; font-size:11px; font-weight:700;
      letter-spacing:5px; text-transform:uppercase; color:var(--orange);
      margin-bottom:18px; display:flex; align-items:center; gap:12px;
      position:relative; z-index:2;
    }
    .welcome-eyebrow::before,
    .welcome-eyebrow::after { content:''; flex:1; max-width:40px; height:2px; background:var(--gradient); }

    .welcome-logo {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(80px,12vw,120px); line-height:0.9; letter-spacing:8px;
      background: var(--gradient);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      filter: drop-shadow(0 0 40px rgba(255,122,0,0.45));
      position:relative; z-index:2;
      animation: titleIn .9s ease;
        width: 300px;
    height: 150px;
    }
.welcome-logo img{
width: 100%;
      }
    @keyframes titleIn {
      from { opacity:0; transform:translateY(36px) scale(0.96); }
      to   { opacity:1; transform:none; }
    }

    .welcome-tag {
      font-size:13px; color:var(--muted); letter-spacing:4px;
      text-transform:uppercase; font-weight:300;
      margin-bottom:52px; position:relative; z-index:2;
    }

    /* btn-start — mesmo padrão do btn-primary do site */
    .btn-start {
      position:relative; overflow:hidden;
      background: var(--gradient); color:#fff; border:none;
      padding:18px 60px;
      font-family:'Syne',sans-serif; font-size:14px; font-weight:800;
      letter-spacing:3px; text-transform:uppercase;
      border-radius:18px; cursor:pointer;
      box-shadow: 0 15px 35px rgba(255,122,0,0.25);
      transition:0.35s; z-index:2;
    }
    .btn-start::before {
      content:''; position:absolute; top:0; left:-120%; width:70%; height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);
      transform:skewX(-25deg); transition:0.8s;
    }
    .btn-start:hover::before { left:150%; }
    .btn-start:hover { transform:translateY(-5px) scale(1.02); box-shadow:0 25px 55px rgba(255,122,0,0.35); }

    /* btn-login — mesmo padrão do btn-outline */
    .btn-login {
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 12px 32px;
      font-family:'Syne',sans-serif; font-size:11px; font-weight:700;
      letter-spacing:2px; text-transform:uppercase;
      border-radius:18px; cursor:pointer;
      margin-top:14px; transition:0.3s; position:relative; z-index:2;
    }
    .btn-login:hover { border-color:var(--orange); color:var(--orange); transform:translateY(-3px); }

    .btn-exit-welcome {
      position:absolute; top:20px; right:20px; z-index:10;
      background:rgba(255,255,255,0.04); color:var(--muted);
      border:1px solid var(--border); padding:8px 18px;
      font-family:'Syne',sans-serif; font-size:10px; font-weight:700;
      letter-spacing:2px; text-transform:uppercase;
      border-radius:14px; cursor:pointer; transition:0.3s;
    }
    .btn-exit-welcome:hover { color:var(--red); border-color:rgba(255,77,77,0.4); background:rgba(255,77,77,0.08); }

    .admin-link {
      position:absolute; bottom:20px; right:20px; z-index:10;
      color:rgba(255,255,255,0.18); font-family:'Syne',sans-serif;
      font-size:10px; font-weight:600; letter-spacing:2px; text-transform:uppercase;
      text-decoration:none; transition:0.3s; padding:6px 10px;
    }
    .admin-link:hover { color:rgba(255,255,255,0.5); }

    /* ══════════════════════════════
       NAME SCREEN
    ══════════════════════════════ */
    .name-screen {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center; padding:32px;
    }

    .name-eyebrow {
      font-family:'Syne',sans-serif; font-size:11px; font-weight:700;
      letter-spacing:5px; text-transform:uppercase; color:var(--orange);
      margin-bottom:14px; display:flex; align-items:center; gap:10px;
    }
    .name-eyebrow::before { content:''; width:30px; height:2px; background:var(--gradient); }

    .name-title {
      font-family:'Bebas Neue',sans-serif; font-size:56px; letter-spacing:3px;
      color:var(--white); margin-bottom:8px; text-align:center; line-height:1;
    }
    .name-sub { font-size:14px; color:var(--muted); margin-bottom:40px; text-align:center; font-weight:300; }

    .name-input {
      width:100%; max-width:600px; padding:20px 28px;
      background:rgba(255,255,255,0.05); border:1px solid var(--border);
      border-radius:18px;
      font-family:'Syne',sans-serif; font-size:17px; font-weight:600;
      letter-spacing:1px; color:var(--white);
      outline:none; text-align:center; transition:0.3s;
      backdrop-filter:blur(10px);
    }
    .name-input::placeholder { color:rgba(255,255,255,0.2); font-weight:400; }
    .name-input:focus { border-color:rgba(255,122,0,0.5); background:rgba(255,122,0,0.06); box-shadow:0 0 0 4px rgba(255,122,0,0.1); }

    .name-btns { display:flex; gap:12px; margin-top:24px; width:100%; max-width:600px; }

    .btn-name-back {
      flex:1; padding:16px;
      background:rgba(255,255,255,0.04); color:var(--muted);
      border:1px solid var(--border); border-radius:18px;
      font-family:'Syne',sans-serif; font-size:11px; font-weight:700;
      letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:0.3s;
    }
    .btn-name-back:hover { border-color:rgba(255,122,0,0.4); color:var(--orange); }

    .btn-name-next {
      flex:1.5; padding:16px; position:relative; overflow:hidden;
      background:var(--gradient); color:#fff; border:none; border-radius:18px;
      font-family:'Syne',sans-serif; font-size:11px; font-weight:800;
      letter-spacing:2px; text-transform:uppercase; cursor:pointer;
      transition:0.35s; box-shadow:0 10px 30px rgba(255,122,0,0.25);
    }
    .btn-name-next::before {
      content:''; position:absolute; top:0; left:-120%; width:70%; height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);
      transform:skewX(-25deg); transition:0.8s;
    }
    .btn-name-next:hover::before { left:150%; }
    .btn-name-next:hover { transform:translateY(-3px); box-shadow:0 18px 45px rgba(255,122,0,0.35); }

    /* ══════════════════════════════
       CATALOG HEADER — estilo nav do site
    ══════════════════════════════ */
    .catalog-header {
      background: rgba(10,10,10,0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 0 24px; height:58px;
      display:flex; align-items:center; gap:16px;
      flex-shrink:0; position:relative; z-index:5;
    }
    .header-logo {
      font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:5px;
      color:var(--orange); text-shadow:0 0 20px rgba(255,122,0,0.4);
        width: 100px;
    height: 50px;
margin-right: 10px;
    }
.header-logo img{
width: 100%;
      }
    .header-divider { width:1px; height:20px; background:rgba(255,255,255,0.06); }

    /* pulse-dot — exatamente igual ao do nav online-indicator */
    .pulse-dot {
      width:10px; height:10px; border-radius:50%;
      background:#00ff88; box-shadow:0 0 15px #00ff88;
      animation:pulseDot 1.6s infinite; flex-shrink:0;

    }
    @keyframes pulseDot { 0%,100%{transform:scale(1)} 50%{transform:scale(1.5)} }

    .header-greeting {
      font-family:'Syne',sans-serif; font-size:11px; font-weight:700;
      letter-spacing:2px; text-transform:uppercase; color:var(--muted);
    }
    .btn-header-exit {
      margin-left:auto;
      background:rgba(255,255,255,0.04); color:var(--muted);
      border:1px solid var(--border); padding:7px 18px;
      font-family:'Syne',sans-serif; font-size:10px; font-weight:700;
      letter-spacing:2px; text-transform:uppercase;
      border-radius:14px; cursor:pointer; transition:0.3s;
    }
    .btn-header-exit:hover { color:var(--red); border-color:rgba(255,77,77,0.4); background:rgba(255,77,77,0.08); }

    /* ══════════════════════════════
       CATALOG LAYOUT
    ══════════════════════════════ */
    .catalog-layout { flex:1; display:flex; overflow:hidden; min-height:0; }

    /* CATEGORY SIDEBAR */
    .cats-sidebar {
      width:90px;
      background:rgba(10,10,10,0.6); backdrop-filter:blur(16px);
      border-right:1px solid rgba(255,255,255,0.06);
      display:flex; flex-direction:column; gap:4px;
      padding:12px 8px; overflow-y:auto; flex-shrink:0;
    }
    .cats-sidebar::-webkit-scrollbar { display:none; }

    .cat-item {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:6px; padding:14px 6px;
      border-radius:18px;
      font-family:'Syne',sans-serif; font-size:9px; font-weight:700;
      letter-spacing:1px; cursor:pointer;
      border:1px solid transparent; background:transparent; color:var(--muted);
      transition:0.3s; text-transform:uppercase; min-height:74px;
    }
    .cat-item:hover { background:rgba(255,122,0,0.08); color:var(--orange); border-color:rgba(255,122,0,0.2); }
    .cat-item.active {
      background:rgba(255,122,0,0.12); color:var(--orange);
      border-color:rgba(255,122,0,0.3);
      box-shadow:0 8px 24px rgba(255,122,0,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .cat-item-icon { font-size:22px; }

    /* PRODUCTS */
    .products-area { flex:1; overflow-y:auto; padding:20px; }
    .products-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:16px; }

    /* product-card — mesmo estilo do .feature-card do site */
    .product-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius:24px;
      backdrop-filter:blur(14px);
      overflow:hidden; cursor:pointer;
      transition:0.35s; position:relative;
    }
    .product-card::after {
      content:''; position:absolute; inset:0;
      background:radial-gradient(circle at top left,rgba(255,255,255,0.06),transparent 40%);
      opacity:0; transition:0.4s;
      pointer-events:none;
    }
    .product-card:hover::after { opacity:1; }
    .product-card:hover {
      transform:translateY(-8px) scale(1.01);
      border-color:rgba(255,122,0,0.25);
      box-shadow:0 25px 60px rgba(0,0,0,0.45);
    }

    .prod-img {
      height:115px; display:flex; align-items:center; justify-content:center;
      font-size:56px;
      background: linear-gradient(135deg,rgba(255,122,0,0.08),rgba(255,85,0,0.04));
    }
    .prod-body { padding:14px; }
    .prod-name { font-family:'Syne',sans-serif; font-weight:700; font-size:13px; color:var(--white); line-height:1.3; }
    .prod-price {
      font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:1px;
      background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      margin-top:4px;
    }

    /* btn-add — gradiente com shimmer */
    .btn-add {
      position:relative; overflow:hidden; width:100%;
      background:var(--gradient); color:#fff; border:none; padding:10px;
      font-family:'Syne',sans-serif; font-size:10px; font-weight:800;
      letter-spacing:2px; text-transform:uppercase;
      border-radius:12px; cursor:pointer; transition:0.35s; margin-top:10px;
      box-shadow:0 6px 20px rgba(255,122,0,0.2);
    }
    .btn-add::before {
      content:''; position:absolute; top:0; left:-120%; width:70%; height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);
      transform:skewX(-25deg); transition:0.8s;
      pointer-events:none;
    }
    .btn-add:hover::before { left:150%; }
    .btn-add:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(255,122,0,0.35); }

    /* ══════════════════════════════
       CART SIDEBAR
    ══════════════════════════════ */
    .cart-sidebar {
      width:280px;
      background:rgba(10,10,10,0.7); backdrop-filter:blur(20px);
      border-left:1px solid rgba(255,255,255,0.06);
      display:flex; flex-direction:column; flex-shrink:0;
      overflow:hidden;
      /* Usa dvh (dynamic viewport height) que desconta barra do browser */
      height: calc(100vh - 58px);
      height: calc(100dvh - 58px);
    }
    .cs-header { padding:18px 20px 14px; border-bottom:1px solid rgba(255,255,255,0.06); flex-shrink:0; }
    .cs-eyebrow {
      font-family:'Syne',sans-serif; font-size:9px; font-weight:700;
      letter-spacing:4px; text-transform:uppercase; color:var(--orange);
      margin-bottom:4px; display:flex; align-items:center; gap:8px;
    }
    .cs-eyebrow::before { content:''; width:14px; height:1.5px; background:var(--gradient); }
    .cs-title {
      font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:4px;
      background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .cs-items { flex:1; overflow-y:auto; padding:10px 14px; min-height:0; }
    .cs-items::-webkit-scrollbar { width:3px; }
    .cs-items::-webkit-scrollbar-thumb { background:rgba(255,122,0,0.3); border-radius:10px; }

    .cs-empty {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center; padding:24px; text-align:center;
    }
    .cs-empty-icon { font-size:44px; opacity:0.15; margin-bottom:14px; }
    .cs-empty-label {
      font-family:'Syne',sans-serif; font-size:10px; font-weight:700;
      letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.15);
    }

    /* cs-item — mesma lógica do how-step */
    .cs-item {
      display:flex; align-items:flex-start; gap:10px;
      padding:10px 6px; border-bottom:1px solid rgba(255,255,255,0.04); transition:0.2s;
    }
    .cs-item:last-child { border-bottom:none; }
    .cs-item:hover { background:rgba(255,255,255,0.03); border-radius:12px; }
    .cs-emoji { font-size:26px; width:32px; text-align:center; flex-shrink:0; margin-top:2px; }
    .cs-info { flex:1; min-width:0; }
    .cs-name { font-family:'Syne',sans-serif; font-weight:700; font-size:12px; color:var(--white); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cs-subtotal {
      font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:1px;
      background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      margin-top:2px;
    }
    .cs-qty-row { display:flex; align-items:center; gap:6px; margin-top:6px; }
    .cs-qty-btn {
      background:rgba(255,255,255,0.06); border:1px solid var(--border);
      width:26px; height:26px; border-radius:10px; font-size:14px; font-weight:700;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:0.2s; line-height:1; color:var(--white);
    }
    .cs-qty-btn:hover { background:var(--gradient); border-color:transparent; }
    .cs-qty-val { font-family:'Syne',sans-serif; font-weight:800; font-size:13px; min-width:18px; text-align:center; }
    .cs-remove { background:none; border:none; color:rgba(255,255,255,0.2); cursor:pointer; font-size:14px; padding:2px; transition:0.2s; margin-top:2px; }
    .cs-remove:hover { color:var(--red); }

    .cs-footer {
      padding:14px 16px;
      border-top:1px solid rgba(255,255,255,0.06);
      flex-shrink:0;
      position:sticky;
      bottom:0;
      background:rgba(10,10,10,0.95);  /* fundo sólido ao fazer sticky */
      z-index:2;
    }
    .cs-total-row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
    .cs-total-label { font-family:'Syne',sans-serif; font-size:10px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--muted); }
    .cs-total-val {
      font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:2px;
      background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .btn-checkout {
      position:relative; overflow:hidden; width:100%;
      background:var(--gradient); color:#fff; border:none; padding:15px;
      font-family:'Syne',sans-serif; font-size:11px; font-weight:800;
      letter-spacing:2.5px; text-transform:uppercase;
      border-radius:16px; cursor:pointer; transition:0.35s;
      box-shadow:0 10px 30px rgba(255,122,0,0.25);
    }
    .btn-checkout::before {
      content:''; position:absolute; top:0; left:-120%; width:70%; height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);
      transform:skewX(-25deg); transition:0.8s;
    }
    .btn-checkout:hover::before { left:150%; }
    .btn-checkout:hover { transform:translateY(-3px); box-shadow:0 18px 50px rgba(255,122,0,0.4); }
    .btn-checkout:disabled { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.2); cursor:not-allowed; transform:none; box-shadow:none; }
    .btn-checkout:disabled::before { display:none; }

    /* ══════════════════════════════
       PAYMENT — card glass
    ══════════════════════════════ */
    .payment-screen {
      flex:1; display:flex; align-items:flex-start; justify-content:center;
      padding:24px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    }
    .payment-screen::-webkit-scrollbar { width:4px; }
    .payment-screen::-webkit-scrollbar-thumb { background:rgba(255,122,0,.3); border-radius:4px; }

    /* card — mesmo estilo do .card-problema */
    .pay-card {
      position:relative; overflow:visible;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:24px; padding:36px;
      width:100%; max-width:430px;
      margin:auto 0;   /* centraliza verticalmente quando cabe */
      backdrop-filter:blur(14px);
      box-shadow:0 10px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .pay-card::before {
      content:''; position:absolute; inset:0; border-radius:inherit;
      background:radial-gradient(circle at top left,rgba(255,255,255,0.07),transparent 40%);
      pointer-events:none;
    }

    .pay-eyebrow {
      font-family:'Syne',sans-serif; font-size:10px; font-weight:700;
      letter-spacing:4px; text-transform:uppercase; color:var(--orange);

<body>
<div class="app" id="main-area"></div>

<script src="assets/js/api.js"></script>
<script>
/* ============================================
 * RANGO — totem.js
 * Substitui o <script> inline do rango_totem.html
 * ============================================ */

/* ─── TEMA CLARO/ESCURO ─── */
(function initTheme() {
  const saved = localStorage.getItem('rango-totem-theme');
  if (saved === 'light' || saved === 'dark') {
    document.documentElement.setAttribute('data-theme', saved);
  }
})();
function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  const next = isLight ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('rango-totem-theme', next);
  render();
}
function themeIcon() {
  return document.documentElement.getAttribute('data-theme') === 'light' ? '🌙' : '☀️';
}

/* ─── ESTADO ─── */
let PRODUCTS    = [];
let CATS        = [];
let CAT_ICONS   = {};
let cart        = [];
let activeCat   = 'todos';
let screen      = 'welcome';
let selectedPay = null;
let orderNum    = null;    // código do pedido (string)
let orderDbId   = null;    // id numérico do BD
let showConfirmExit = false;
let pollingTimer    = null;
let pixPago         = false;   // true quando Asaas confirmar o pagamento
let pixData     = null;    // { pix_qrcode, pix_copypaste }

const _fmt = n => 'R$ ' + parseFloat(n).toFixed(2).replace('.', ',');
const total= () => cart.reduce((s, i) => s + parseFloat(i.preco) * i.qty, 0);

/* ─── CARREGA DADOS DO BACKEND ─── */
async function carregarCardapio() {
  try {
    const [catRes, prodRes] = await Promise.all([
      API.categorias.listar(),
      API.produtos.listar(),
    ]);
    if (catRes.ok) {
      CATS = ['todos', ...catRes.dados.map(c => c.id.toString())];
      CAT_ICONS = { todos: '🍽️' };
      catRes.dados.forEach(c => { CAT_ICONS[c.id.toString()] = c.icone || '🍽️'; });
      // mapa id → nome p/ filtros
      window._catMap = {};
      catRes.dados.forEach(c => { window._catMap[c.id.toString()] = c; });
    }
    if (prodRes.ok) PRODUCTS = prodRes.dados;
  } catch (e) {
    console.error('Erro ao carregar cardápio:', e);
  }
  render();
}

/* ─── RENDER PRINCIPAL ─── */
function render() {
  const area = document.getElementById('main-area');
  if (!area) return;
  let html = '';
  if (screen === 'welcome')  html = renderWelcome();
  else if (screen === 'catalog')  html = renderCatalog();
  else if (screen === 'payment')  html = renderPayment();
  else if (screen === 'success')  html = renderSuccess();
  if (showConfirmExit) html += renderConfirm();
  area.innerHTML = html;
}

/* ─── TELA WELCOME ─── */
function renderWelcome() {
  const fechada = window._cantinaFechada;
  return `<div class="welcome-screen" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <button class="btn-theme-toggle" style="position:absolute;top:20px;left:20px;z-index:10" onclick="toggleTheme()" title="Alternar tema">${themeIcon()}</button>
    <button class="btn-exit-welcome" onclick="sairParaLogin()">✕ &nbsp;Sair</button>
    <div class="welcome-eyebrow">Autoatendimento</div>
    <div class="welcome-logo"><img src="assets/img/rangologo.png" alt="" width="90"></div>
    <div class="welcome-tag">Peça rápido · Coma bem</div>
    ${fechada
      ? `<div style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:14px;padding:14px 28px;margin:18px 0 10px;font-family:'Syne',sans-serif;font-size:.88rem;font-weight:700;color:#ff6b6b;text-align:center;max-width:400px">
           ⏰ ${fechada}
         </div>
         <button class="btn-start" style="opacity:.45;cursor:not-allowed;filter:grayscale(.5)" disabled>Iniciar Pedido</button>`
      : `<button class="btn-start" onclick="go('catalog')">Iniciar Pedido</button>`}
  </div>`;
}

/* ─── TELA CATÁLOGO ─── */
function renderCatalog() {
  const catMap = window._catMap || {};
  const filtrados = activeCat === 'todos'
    ? PRODUCTS
    : PRODUCTS.filter(p => p.categoria_id?.toString() === activeCat);

  const cats = CATS.map(c => {
    const label = c === 'todos' ? 'Todos' : (catMap[c]?.nome || c);
    return `<button class="cat-item${activeCat === c ? ' active' : ''}" onclick="setcat('${c}')">
      <span class="cat-item-icon">${(()=>{const ic=CAT_ICONS[c]||'🍽️'; return(ic.startsWith('data:')||ic.startsWith('http'))?`<img src="${ic}" style="width:22px;height:22px;object-fit:contain;border-radius:3px">`:ic;})()} </span>${label}
    </button>`;
  }).join('');

  const prods = filtrados.map(p => {
    const inStock = parseInt(p.estoque) > 0 && p.ativo;
    return `<div class="product-card" ${inStock ? '' : 'style="opacity:.5;pointer-events:none"'}>
      ${!inStock ? '<div style="position:absolute;top:8px;right:8px;background:var(--red);color:#fff;font-size:.65rem;font-family:\'Syne\',sans-serif;font-weight:700;padding:3px 8px;border-radius:8px;letter-spacing:1px;text-transform:uppercase;z-index:2">Esgotado</div>' : ''}
      <div class="prod-img" style="${p.imagem ? 'padding:0;overflow:hidden' : ''}">
        ${p.imagem
          ? `<img src="${p.imagem}" alt="${p.name}"
               style="width:100%;height:100%;object-fit:cover;display:block"
               onerror="this.parentElement.innerHTML='${p.emoji}';">`
          : p.emoji}
      </div>
      <div class="prod-body">
        <div class="prod-name">${p.nome}</div>
        <div class="prod-price">${_fmt(p.preco)}</div>
        ${inStock ? `<button class="btn-add" onclick="addToCart(${p.id})">+ Adicionar</button>` : ''}
      </div>
    </div>`;
  }).join('');

  const cartContent = cart.length === 0
    ? `<div class="cs-empty"><div class="cs-empty-icon">🛒</div><div class="cs-empty-label">Escolha seu rango</div></div>`
    : `<div class="cs-items">${cart.map(i => `
        <div class="cs-item">
          <div class="cs-emoji" style="${i.imagem ? 'padding:0;overflow:hidden;border-radius:10px' : ''}">
          ${i.imagem
            ? `<img src="${i.imagem}" alt="${i.nome||i.name||'item'}" style="width:52px;height:52px;object-fit:cover;border-radius:10px;display:block"
                 onerror="this.parentElement.innerHTML='${i.emoji}';">`
            : (i.imagem===undefined ? i.emoji||'🍽️' : i.emoji||'🍽️')}
        </div>
          <div class="cs-info">
            <div class="cs-name">${i.nome}</div>
            <div class="cs-subtotal">${_fmt(parseFloat(i.preco) * i.qty)}</div>
            <div class="cs-qty-row">
              <button class="cs-qty-btn" onclick="changeQty(${i.id},-1)">−</button>
              <span class="cs-qty-val">${i.qty}</span>
              <button class="cs-qty-btn" onclick="changeQty(${i.id},1)">+</button>
            </div>
          </div>
          <button class="cs-remove" onclick="removeItem(${i.id})">✕</button>
        </div>`).join('')}
      </div>`;

  return `<div style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    <div class="catalog-header">
      <div class="header-logo"><img src="assets/img/rangologo.png" alt="" width="90"></div>
      <div class="header-divider"></div>
      <div class="pulse-dot"></div>
      <div class="header-greeting">Cardápio</div>
      <button class="btn-theme-toggle" style="margin-left:auto" onclick="toggleTheme()" title="Alternar tema">${themeIcon()}</button>
      <button class="btn-header-exit" onclick="askExit()">✕ &nbsp;Sair</button>
    </div>
    <div class="catalog-layout">
      <div class="cats-sidebar">${cats}</div>
      <div class="products-area"><div class="products-grid">${prods || '<div style="color:var(--muted);padding:32px;text-align:center">Nenhum produto disponível.</div>'}</div></div>
      <div class="cart-sidebar">
        <div class="cs-header">
          <div class="cs-eyebrow">Pedido atual</div>
          <div class="cs-title">MEU PEDIDO</div>
        </div>
        ${cartContent}
        <div class="cs-footer">
          <div class="cs-total-row">
            <span class="cs-total-label">Total</span>
            <span class="cs-total-val">${_fmt(total())}</span>
          </div>
          <button class="btn-checkout" onclick="go('payment')" ${cart.length === 0 ? 'disabled' : ''}>
            ${cart.length === 0 ? 'Adicione itens' : 'Finalizar Pedido →'}
          </button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ─── TELA PAGAMENTO ─── */
function renderPayment() {
  const ms = [
    { id:'pix',     icon:'📱', label:'PIX',        sub:'QR Code instantâneo' },
    { id:'cartao',  icon:'💳', label:'Cartão',      sub:'Débito ou crédito' },
    { id:'dinheiro',icon:'💵', label:'Dinheiro',    sub:'Pague no balcão' },
    { id:'tap',     icon:'📲', label:'Tap to Pay',  sub:'Aproxime o celular' },
  ];
  const mh = ms.map(m => `
    <div class="pay-method${selectedPay === m.id ? ' selected' : ''}" onclick="selectedPay='${m.id}';render()">
      <div class="pm-icon">${m.icon}</div>
      <div class="pm-label">${m.label}</div>
      <div style="font-size:.6rem;color:var(--muted);margin-top:2px">${m.sub}</div>
    </div>`).join('');

  // Coluna direita: QR Code (quando PIX selecionado) ou aviso físico
  const rightCol = pixData ? `
    <div class="pay-right-col">
      <div style="font-family:'Syne',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--orange);margin-bottom:12px">Pague com PIX</div>
      ${pixData.carregando
        ? `<div style="width:200px;height:200px;border-radius:14px;border:2px dashed rgba(255,122,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto;gap:10px">
             <div style="font-size:2rem">⏳</div>
             <div style="font-size:.72rem;color:var(--muted);text-align:center;font-family:'Syne',sans-serif;letter-spacing:1px">GERANDO<br>QR CODE...</div>
           </div>`
        : `<img src="data:image/png;base64,${pixData.pix_qrcode}"
               style="width:200px;height:200px;border-radius:14px;border:2px solid rgba(255,122,0,.3);display:block;margin:0 auto">`
      }
      <button onclick="copiarPix()"
        style="margin-top:12px;width:100%;background:rgba(255,122,0,.12);color:var(--orange);border:1px solid rgba(255,122,0,.3);border-radius:10px;padding:10px;font-family:'Syne',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:2px;cursor:pointer;text-transform:uppercase">
        📋 Copiar código PIX
      </button>
      <div id="pix-status" style="margin-top:8px;font-size:.75rem;color:var(--muted);text-align:center">Aguardando pagamento...</div>
    </div>
  ` : selectedPay && selectedPay !== 'pix' ? `
    <div class="pay-right-col" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
      <div style="font-size:3rem;margin-bottom:12px">🏦</div>
      <div style="font-family:'Syne',sans-serif;font-size:.75rem;font-weight:700;color:var(--orange);letter-spacing:1px;margin-bottom:8px">PAGAMENTO FÍSICO</div>
      <div style="font-size:.82rem;color:var(--muted);line-height:1.6">
        Dirija-se ao balcão da cantina e realize o pagamento na maquininha da atendente.
      </div>
    </div>
  ` : `
    <div class="pay-right-col" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:.3">
      <div style="font-size:3rem;margin-bottom:8px">←</div>
      <div style="font-family:'Syne',sans-serif;font-size:.7rem;letter-spacing:2px">Selecione uma forma</div>
    </div>
  `;

  return `<div class="payment-screen">
    <!-- Layout em duas colunas no tablet: esquerda=opções, direita=QR/info -->
    <div class="pay-two-col">

      <!-- Coluna esquerda: cabeçalho + métodos + botão -->
      <div class="pay-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;position:relative;z-index:1">
          <button class="btn-back" onclick="go('catalog')">← Voltar</button>
          <div style="display:flex;gap:8px">
            <button class="btn-theme-toggle" onclick="toggleTheme()" title="Alternar tema">${themeIcon()}</button>
            <button class="btn-header-exit" onclick="askExit()">✕ Sair</button>
          </div>
        </div>
        <div class="pay-eyebrow">Finalização</div>
        <div class="pay-title">PAGAMENTO</div>
        <div class="pay-total">${_fmt(total())}</div>
        <div class="pay-methods">${mh}</div>
        ${selectedPay === 'pix' && pixData
          ? `<div style="text-align:center">
               <div id="pix-status" style="color:var(--muted);font-size:.78rem;font-family:'Syne',sans-serif;letter-spacing:1px;margin-bottom:10px">
                 ${pixPago ? '✅ Pagamento confirmado!' : '⏳ Aguardando pagamento...'}
               </div>
               <div style="font-size:.65rem;color:var(--muted);font-family:'DM Sans',sans-serif;margin-bottom:14px">
                 ${pixPago ? 'Redirecionando...' : 'A tela avançará automaticamente ao confirmar'}
               </div>
               ${!pixPago ? `<button class="btn-pay" onclick="confirmarPagamento()">Já paguei!</button>` : ''}
             </div>`
          : `<button class="btn-pay" onclick="confirmarPagamento()" ${!selectedPay ? 'disabled' : ''}>
               ${selectedPay ? 'Confirmar Pagamento' : 'Selecione uma forma'}
             </button>`
        }
      </div>

      <!-- Coluna direita: QR Code ou aviso -->
      ${rightCol}

    </div>
  </div>`;
}

/* ─── TELA SUCESSO ─── */
function renderSuccess() {
  return `<div class="success-screen" style="flex:1">
    <div class="success-icon">✅</div>
    <div class="success-eyebrow">Confirmado</div>
    <div class="order-num">Número do Pedido</div>
    <div class="order-big">${orderNum || '—'}</div>
    <div class="success-msg">Pedido confirmado!</div>
    <div class="success-sub">Aguarde ser chamado no balcão 🎉</div>
    <button class="btn-new" onclick="newOrder()">Novo Pedido</button>
  </div>`;
}

/* ─── CONFIRMAÇÃO SAÍDA ─── */
function renderConfirm() {
  return `<div class="confirm-overlay" onclick="if(event.target===this){showConfirmExit=false;render()}">
    <div class="confirm-box">
      <div class="confirm-icon">🚪</div>
      <div class="confirm-title">SAIR?</div>
      <div class="confirm-sub">Seu carrinho será descartado.<br>Tem certeza?</div>
      <div class="confirm-btns">
        <button class="btn-cancel-confirm" onclick="showConfirmExit=false;render()">Cancelar</button>
        <button class="btn-confirm-exit" onclick="doExit()">Sair</button>
      </div>
    </div>
  </div>`;
}

/* ─── NAVEGAÇÃO ─── */
async function go(s) {
  if (s === 'payment' && cart.length === 0) { showToast('Adicione itens primeiro'); return; }

  // Verifica horário antes de entrar no catálogo
  if (s === 'catalog') {
    try {
      const tok = localStorage.getItem('rango-totem-token');
      const h = { 'Content-Type': 'application/json' };
      if (tok) h['X-Rango-Token'] = tok;
      const r = await fetch('api/horarios.php?check=1', { headers: h, credentials: 'include' });
      if (r.ok) {
        const data = await r.json();
        // Só bloqueia se a resposta for explicitamente ok:true e aberto:false
        if (data && data.ok === true && data.dados && data.dados.aberto === false) {
          const prox = data.dados.proximo_turno;
          window._cantinaFechada = prox
            ? 'Cantina fechada. Abre às ' + prox.abre_em + '.'
            : 'Cantina fechada no momento.';
          render(); // re-renderiza welcome com o aviso
          return;   // não avança para o catálogo
        }
      }
    } catch (e) {
      // Falha na API de horário → deixa passar (não bloqueia)
    }
  }

  window._cantinaFechada = null;
  screen = s; selectedPay = null; pixData = null;
  render();
}
function setcat(c) { activeCat = c; render(); }

/* ─── CARRINHO ─── */
function addToCart(id) {
  const p = PRODUCTS.find(x => x.id == id);
  if (!p) return;
  const ex = cart.find(x => x.id == id);
  if (ex) ex.qty++;
  else cart.push({ ...p, qty: 1 });
  showToast(`${p.emoji || ''} ${p.nome} adicionado`);
  render();
}
function changeQty(id, d) {
  const i = cart.findIndex(x => x.id == id);
  if (i < 0) return;
  cart[i].qty += d;
  if (cart[i].qty <= 0) cart.splice(i, 1);
  render();
}
function removeItem(id) { cart = cart.filter(x => x.id != id); render(); }

/* ─── PAGAMENTO (chama API) ─── */
async function confirmarPagamento() {
  if (!selectedPay) return;

  // Para PIX: cria cobrança e mostra QR code antes de confirmar
  if (selectedPay === 'pix' && !pixData) {
    showToast('Gerando QR Code PIX...');
    const forma_map = { pix:'pix', cartao:'cartao_credito', dinheiro:'dinheiro', tap:'cartao_debito' };
    const itens = cart.map(i => ({ produto_id: i.id, quantidade: i.qty }));
    try {
      const res = await API.pedidos.criar({
        itens,
        forma_pagamento: forma_map[selectedPay] || 'pix',
        origem: 'totem',
        cliente_nome: 'Autoatendimento',
      });
      if (!res.ok) { showToast(res.erro || 'Erro ao criar pedido.'); return; }
      const p = res.dados;
      orderNum  = p.codigo;
      orderDbId = p.id;
      if (p.pagamento?.pix_qrcode) {
        pixData = { pix_qrcode: p.pagamento.pix_qrcode, pix_copypaste: p.pagamento.pix_copypaste };
        render();
        iniciarPolling(p.id);
      } else if (p.id) {
        // QR ainda não gerado (produção demora) — mostra loading e busca em background
        pixData = { pix_qrcode: null, pix_copypaste: null, carregando: true };
        render(); // mostra tela de pagamento com loading
        aguardarQrCodeTotem(p.id);
        iniciarPolling(p.id);
      } else {
        screen = 'success'; render();
      }
    } catch (e) { showToast('Erro de conexão.'); }
    return;
  }

  // Para outros métodos, ou PIX confirmado manualmente ("Já paguei!")
  if (selectedPay === 'pix' && pixData) {
    // Confirmação manual (sandbox) — para o polling e avança
    clearInterval(pollingTimer);
  }
  if (!orderDbId) {
    const forma_map = { pix:'pix', cartao:'cartao_credito', dinheiro:'dinheiro', tap:'cartao_debito' };
    const itens = cart.map(i => ({ produto_id: i.id, quantidade: i.qty }));
    try {
      const res = await API.pedidos.criar({
        itens,
        forma_pagamento: forma_map[selectedPay] || 'dinheiro',
        origem: 'totem',
        cliente_nome: 'Autoatendimento',
      });
      if (!res.ok) { showToast(res.erro || 'Erro.'); return; }
      orderNum  = res.dados.codigo;
      orderDbId = res.dados.id;
    } catch (e) { showToast('Erro de conexão.'); return; }
  }
  screen = 'success';
  render();
}

function copiarPix() {
  if (!pixData?.pix_copypaste) return;
  navigator.clipboard.writeText(pixData.pix_copypaste)
    .then(() => showToast('PIX copiado! 📋'));
}

function iniciarPolling(dbId) {
  clearInterval(pollingTimer);
  pixPago = false;
  let tries = 0;
  pollingTimer = setInterval(async () => {
    if (tries++ > 36) { clearInterval(pollingTimer); return; } // ~6 min
    try {
      const res = await API.pedidos.verificarPagto(dbId);
      if (res?.ok && res.dados?.pago) {
        clearInterval(pollingTimer);
        pixPago = true;
        render(); // re-renderiza — botão some, mensagem de confirmado aparece
        setTimeout(() => { screen = 'success'; pixPago = false; render(); }, 2000);
      }
    } catch(e) {}
  }, 8000); // verifica a cada 8s
}

/* ─── FLUXO ─── */
function newOrder()  { clearInterval(pollingTimer); cart=[]; screen='welcome'; selectedPay=null; pixData=null; pixPago=false; orderNum=null; orderDbId=null; render(); }
function askExit() {
  if (screen === 'welcome') { sairParaLogin(); return; }
  showConfirmExit = true; render();
}
function sairParaLogin() {
  clearInterval(pollingTimer);
  cart=[]; selectedPay=null; pixData=null; orderNum=null; orderDbId=null;
  const tok = localStorage.getItem('rango-totem-token');
  localStorage.removeItem('rango-totem-token');

  // Faz logout na API (invalida session PHP + token) antes de redirecionar
  // Usa keepalive para garantir que o fetch complete mesmo após navigation
  const headers = { 'Content-Type': 'application/json' };
  if (tok) headers['X-Rango-Token'] = tok;
  fetch('api/auth.php?action=logout', {
    method: 'POST',
    headers,
    credentials: 'include',
    keepalive: true,
    body: JSON.stringify({}),
  }).finally(() => {
    window.location.href = 'rango-login.html';
  });
}
function doExit()    { clearInterval(pollingTimer); cart=[]; screen='welcome'; selectedPay=null; pixData=null; pixPago=false; orderNum=null; orderDbId=null; showConfirmExit=false; render(); }

/* ─── TOAST ─── */
function showToast(msg) {
  let t = document.querySelector('.toast');
  if (t) t.remove();
  t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ─── INIT ─── */
carregarCardapio();

</script>
